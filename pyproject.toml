[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedknob"
version = "0.1.0"
description = "Does the Dirichlet non-IID knob still turn at real client boundaries?"
requires-python = ">=3.11"
# NOTE: torch is intentionally NOT pinned here -- install it separately with
# the CUDA wheel that matches your GPU (Blackwell needs cu128 nightly).
dependencies = [
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.21",
    "accelerate>=0.33",
    "numpy",
]

[project.optional-dependencies]
fl = [
    "flwr[simulation]>=1.11",
    "hydra-core>=1.3",
    "omegaconf",
    "wandb",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Registered so `-m "not slow"` works and pytest stops warning about an
# unknown mark. These tests read a frozen partition from disk or build a
# DistilBERT-LoRA model, so they are seconds rather than milliseconds.
markers = [
    "slow: touches real artifacts on disk or builds a model",
]
filterwarnings = [
    # torch deprecates jit.script_method internally; transformers still calls
    # it on import. Nothing in this repository uses torch.jit, so there is
    # nothing here to migrate -- drop the ignore when torch stops emitting it.
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]
